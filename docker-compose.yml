version: "3.9"

services:
  # MongoDB (local development)
  mongo:
    image: mongo:7.0
    container_name: opntus_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: opntus

  # Backend API + Socket.IO
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opntus_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/opntus
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      JWT_EXPIRES_IN: 7d
      IP_SALT: ${IP_SALT:-dev_salt_change_in_production}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:-dev_admin_key}
    depends_on:
      - mongo
    volumes:
      - ./backend/src:/app/src

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opntus_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
